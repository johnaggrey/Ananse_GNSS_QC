[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "AnanseQC"
version = "0.1.0"
description = "Quality control for GNSS RINEX observation files"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "John Aggrey"},
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
ananse-qc = "AnanseQC.CommandLineInterface:Main"

[tool.setuptools.packages.find]
where = ["."]
include = ["AnanseQC*"]

[tool.pytest.ini_options]
testpaths = ["Tests"]
pythonpath = ["."]
